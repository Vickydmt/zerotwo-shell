# ====================================================================
# ZeroTwo Linux - Custom MPV Keybindings
# ====================================================================

# 1. Subtitle & Audio track switching
v cycle sub                  # Cycle subtitles forward
V cycle sub down             # Cycle subtitles backward
b cycle audio                # Cycle audio tracks forward
B cycle audio down           # Cycle audio tracks backward

# 2. Playback speed adjustment
[ add speed -0.1             # Decrease speed by 0.1x
] add speed 0.1              # Increase speed by 0.1x
{ multiply speed 0.90909091  # Decrease speed by factor
} multiply speed 1.1         # Increase speed by factor
\ set speed 1.0              # Reset speed to 1.0x

# 3. Volume controls (Up / Down arrow keys & Page Up / Page Down)
UP         add volume 5      # Up arrow = Volume up
DOWN       add volume -5     # Down arrow = Volume down
Shift+UP   add volume 10     # Shift+Up = Volume up faster
Shift+DOWN add volume -10    # Shift+Down = Volume down faster
PGUP       add volume 5      # Page Up = Volume up
PGDWN      add volume -5     # Page Down = Volume down

# 4. Headphone Play / Pause controls
PLAY        cycle pause      # Headphone play button
PAUSE       cycle pause      # Headphone pause button
PLAYPAUSE   cycle pause      # Headphone play/pause toggle
PLAYONLY    set pause no
PAUSEONLY   set pause yes
XF86_PAUSE  cycle pause

# 5. Headphone Double-Tap (Seek 10 seconds)
# Double-tap right (Next) = 10s forward
# Double-tap left (Prev) = 10s backward
NEXT        seek 10          # Headphone double-tap right
PREV        seek -10         # Headphone double-tap left
FORWARD     seek 10
REWIND      seek -10
XF86_NEXT   seek 10
XF86_PREV   seek -10

# Standard horizontal seeking
RIGHT       seek 5
LEFT        seek -5
Shift+RIGHT seek 30
Shift+LEFT  seek -30

# Fullscreen toggle
f           cycle fullscreen
ESC         set fullscreen no
