# ====================================================================
# ZeroTwo Linux - Custom MPV Configuration
# ====================================================================

# Auto Fullscreen on open
fs=yes

# Video & Hardware Acceleration
vo=gpu-next
gpu-context=wayland
hwdec=auto-safe

# Language Priority: Japanese first for audio, English first for subtitles
alang=ja,jp,jpn,japanese,en,eng,english
slang=en,eng,english,ja,jp,jpn,japanese

# Subtitles auto-detection & clean styling
sub-auto=all
sub-font="Open Sans Semibold"
sub-font-size=48
sub-color="#FFFFFFFF"
sub-border-color="#FF101010"
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color="#33000000"

# Audio & Tracks auto-detection
audio-file-auto=fuzzy

# Quality & Behavior
keep-open=yes
save-position-on-quit=yes
autofit-larger=100%x100%

# OSD styling
osd-font="Open Sans"
osd-font-size=32
osd-duration=2000
osd-color="#FFFFFFFF"
osd-border-color="#FF101010"
osd-border-size=2
